<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/theme-init.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diff Checker - Basu Jindal</title>
  <meta name="description" content="Compare text and see differences highlighted">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div class="container">
    <header></header>

    <main>
      <h1 class="page-title">Diff Checker</h1>

      <div class="toolbar">
        <div class="stats">
          <span class="added-count">+ <span id="added-count">0</span> added</span>
          <span class="removed-count">- <span id="removed-count">0</span> removed</span>
          <span class="unchanged-count"><span id="unchanged-count">0</span> unchanged</span>
        </div>
        <div class="toolbar-center">
          <div class="toggle-container">
            <label for="line-numbers-toggle">Line #</label>
            <div class="toggle">
              <input type="checkbox" id="line-numbers-toggle" checked>
              <span class="toggle-slider"></span>
            </div>
          </div>
          <div class="toggle-container">
            <label for="inline-diff-toggle">Inline</label>
            <div class="toggle">
              <input type="checkbox" id="inline-diff-toggle" checked>
              <span class="toggle-slider"></span>
            </div>
          </div>
          <div class="toggle-container" id="char-diff-container">
            <label for="char-diff-toggle">Char diff</label>
            <div class="toggle">
              <input type="checkbox" id="char-diff-toggle">
              <span class="toggle-slider"></span>
            </div>
          </div>
        </div>
        <div class="toolbar-right">
          <button class="swap-btn" id="swap-btn" title="Swap original and modified">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/>
            </svg>
          </button>
          <button class="fullscreen-btn" id="fullscreen-btn" title="Toggle fullscreen">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- Floating toolbar for fullscreen mode -->
  <div class="fullscreen-toolbar">
    <div class="toggle-container">
      <label for="line-numbers-toggle-fs">Line #</label>
      <div class="toggle">
        <input type="checkbox" id="line-numbers-toggle-fs" checked>
        <span class="toggle-slider"></span>
      </div>
    </div>
    <div class="toggle-container">
      <label for="inline-diff-toggle-fs">Inline</label>
      <div class="toggle">
        <input type="checkbox" id="inline-diff-toggle-fs" checked>
        <span class="toggle-slider"></span>
      </div>
    </div>
    <div class="toggle-container" id="char-diff-container-fs">
      <label for="char-diff-toggle-fs">Char diff</label>
      <div class="toggle">
        <input type="checkbox" id="char-diff-toggle-fs">
        <span class="toggle-slider"></span>
      </div>
    </div>
    <button class="swap-btn" id="swap-btn-fs" title="Swap original and modified">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4"/>
      </svg>
    </button>
    <button class="fullscreen-btn" id="exit-fullscreen-btn" title="Exit fullscreen">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 14h6v6m10-10h-6V4m0 6 7-7M3 21l7-7"/>
      </svg>
    </button>
  </div>

  <div class="diff-container">
    <div class="panel" data-panel="original">
      <div class="panel-header">Original Text</div>
      <div class="textarea-wrapper">
        <div class="line-numbers-gutter" id="text1-gutter"></div>
        <div class="textarea-overlay" id="text1-overlay"></div>
        <textarea id="text1" placeholder="Paste original text here..." spellcheck="false" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false"></textarea>
      </div>
    </div>
    <div class="panel" data-panel="modified">
      <div class="panel-header">Modified Text</div>
      <div class="textarea-wrapper">
        <div class="line-numbers-gutter" id="text2-gutter"></div>
        <div class="textarea-overlay" id="text2-overlay"></div>
        <textarea id="text2" placeholder="Paste modified text here..." spellcheck="false" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false"></textarea>
      </div>
    </div>
    <div class="diff-panel" data-panel="diff">
      <div class="panel-header diff-panel-header">
        <span>Difference</span>
        <button class="diff-only-toggle" id="diff-only-toggle" title="Toggle diff only view">
          <span class="toggle-label">Diff Only</span>
        </button>
      </div>
      <div class="diff-output" id="diff-output"><div class="line line-unchanged">Paste text in the panels to see the diff...</div></div>
    </div>
  </div>

  <div class="container">
    <footer></footer>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/diff.js"></script>
</body>
</html>
