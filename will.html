<!DOCTYPE html>
<html>
<head>
    <title>Photo Selector</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #800000, #a52a2a, #d2691e);
        }
        #gifContainer{
            display: flex;
            flex-direction: column;
            align-items: center;

        }
        #buttonContainer {
            display: flex;
            flex-direction: row;
            align-items: center;
            
        }
        .button {
            font-size: 25px; /* Increased font size */
            padding: 15px 30px; /* Larger buttons */
            margin: 15px;
            background-color: transparent;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
            border: 5px coral
        }
        .button:hover {
            background-color: white;
            color: black;
        }
        #imageDisplay {
            margin-top: 20px;
        }
        h2 {
            font-size: 44px; /* Increased default font size for heading */
        }


    /* Responsive styles for smaller screens */
    @media screen and (max-width: 1000px) {
        .button {
            font-size: 45px; /* Larger font size for mobile */
            padding: 25px 50px; /* Larger padding for mobile */
        }
    }
    </style>
    
</head>
<body>

    <div id="gifContainer">
        <h2>Do you like this website?</h2>
        <img src="cat-please.gif" alt="Your GIF" id="yourGif"> <!-- Add this line for the GIF -->

    <div id="buttonContainer">
        <button id="yesButton" class="button">Yes</button>
        <button id="noButton" class="button">No</button>
    </div>
    </div>

    <div id="imageDisplay"></div>

    <script>
        document.getElementById('yesButton').addEventListener('click', function() {
            document.getElementById('imageDisplay').innerHTML = '<img src="Y.png" alt="Photo A" />';
            document.getElementById('buttonContainer').style.display = 'none'; // Hide buttons and question
        });

        document.getElementById('noButton').addEventListener('click', function() {
            document.getElementById('imageDisplay').innerHTML = '<img src="n.png" alt="Photo B" />';
            document.getElementById('buttonContainer').style.display = 'none'; // Hide buttons and question
        });
    </script>
</body>
</html>
