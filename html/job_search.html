<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/theme-init.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Search - Basu Jindal</title>
  <meta name="description" content="Job search tool for finding AI/ML positions">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div class="container">
    <header></header>

    <main>
      <h1 class="page-title">Search Jobs</h1>
      <p class="page-subtitle">Generate Google search queries for job postings</p>

      <form id="searchForm" class="job-search-form" onsubmit="return false;">
        <!-- Date & Quick Presets -->
        <div class="job-search-controls">
          <div class="job-search-section">
            <label for="afterDate">Jobs posted after:</label>
            <div class="job-search-date-row">
              <input type="date" id="afterDate" name="afterDate">
              <div class="date-presets">
                <button type="button" class="preset-btn" data-days="0">Today</button>
                <button type="button" class="preset-btn" data-days="1">Yesterday</button>
                <button type="button" class="preset-btn active" data-days="2">2 days</button>
                <button type="button" class="preset-btn" data-days="7">Week</button>
                <button type="button" class="preset-btn" data-days="30">Month</button>
              </div>
            </div>
          </div>

          <div class="job-search-section">
            <label>Add custom option:</label>
            <div class="job-search-add-row">
              <select id="optionCategory"></select>
              <input type="text" id="newOption" name="newOption" placeholder="Enter option...">
              <button type="button" onclick="addOption()" class="btn btn-icon" title="Add option">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              </button>
            </div>
          </div>
        </div>

        <script>
          const date = new Date();
          date.setDate(date.getDate() - 2);
          document.getElementById('afterDate').value = date.toISOString().split('T')[0];
        </script>

        <!-- Action Buttons -->
        <div class="job-search-actions">
          <button type="button" onclick="generateSearch()" class="btn job-search-submit">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
            Search Google
          </button>
          <button type="button" onclick="copySearchUrl()" class="btn btn-secondary" id="copyBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            Copy URL
          </button>
          <button type="button" onclick="clearLocalStorage()" class="btn btn-ghost" title="Reset to defaults">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
            Reset
          </button>
        </div>
      </form>

      <div id="searchUrl" class="job-search-url"></div>
    </main>

    <footer></footer>
  </div>
  <script src="../js/components.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/jobSearch.js"></script>
</body>
</html>
