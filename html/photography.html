<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/theme-init.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography - Basu Jindal</title>
  <meta name="description" content="Astrophotography by Basu Jindal">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <header></header>

    <main>
      <h1>Astrophotography</h1>
      <!-- <p style="color: var(--text-secondary); margin-bottom: 1rem;">Astrophotography and landscapes</p> -->

      <div class="gallery" id="gallery">
        <figure class="gallery-item"
                data-src="../astrophotos/Orion Nebula.png"
                data-title="Orion Nebula"
                data-description="Orion Nebula aka Messier 42, tracked with Skywatcher Star Adventurer GTi. 39 Light frames for 30s exposure each."
                data-camera="Sony Alpha7R III"
                data-lens="E 50-400mm f/4.5-6.3 A067"
                data-settings="ISO 100mm f/6.3"
                data-location="Snoqualmie Pass, WA"
                data-date="2025-01-25"
                data-alt="Orion Nebula">
          <img src="../astrophotos/Orion Nebula.png" alt="Orion Nebula" loading="lazy">
          <figcaption><h3>Orion Nebula</h3></figcaption>
        </figure>

        <figure class="gallery-item"
                data-src="../astrophotos/Pleaides.png"
                data-title="Pleaides"
                data-description="Pleaides aka Messier 45, tracked with Skywatcher Star Adventurer GTi. 130 Light, 9 Dark frames for 30s exposure each."
                data-camera="Sony Alpha7R III"
                data-lens="E 50-400mm f/4.5-6.3 A067"
                data-settings="ISO 400mm f/6.3"
                data-location="Snoqualmie Pass, WA"
                data-date="2025-02-28"
                data-alt="Pleaides">
          <img src="../astrophotos/Pleaides.png" alt="Pleaides" loading="lazy">
          <figcaption><h3>Pleaides</h3></figcaption>
        </figure>

        <figure class="gallery-item"
                data-src="../astrophotos/Milkyway at Shaasta.jpg"
                data-title="Milkyway"
                data-description="Milkyway, shot from Fowler's Campground, Mount Shaasta."
                data-camera="Nikon Z6"
                data-lens="Rokinon 14mm f/2.8"
                data-settings="30s ISO 6400 14mm f/2.8"
                data-location="Fowler's Campground, Near Mount Shaasta"
                data-date="2025-08-29"
                data-alt="Milkyway">
          <img src="../astrophotos/Milkyway at Shaasta.jpg" alt="Milkyway" loading="lazy">
          <figcaption><h3>Milkyway</h3></figcaption>
        </figure>
      </div>

      <!-- Lightbox -->
      <div class="lightbox" id="lightbox" aria-hidden="true">
        <button class="close" id="lb-close" aria-label="Close">&times;</button>
        <button class="fullscreen-toggle" id="lb-fullscreen" aria-label="Toggle fullscreen">&#x26F6;</button>
        <div class="lightbox-content">
          <img id="lb-img" alt="">
          <div class="lightbox-details">
            <h3 id="lb-title"></h3>
            <p id="lb-desc"></p>
            <ul class="meta-list" id="lb-meta"></ul>
          </div>
        </div>
        <button class="nav prev" id="lb-prev" aria-label="Previous">&#10094;</button>
        <button class="nav next" id="lb-next" aria-label="Next">&#10095;</button>
      </div>
    </main>

    <footer></footer>
  </div>
  <script src="../js/components.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
