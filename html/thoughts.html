<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/theme-init.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thoughts - Basu Jindal</title>
  <meta name="description" content="Quick thoughts, updates, and notes by Basu Jindal">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/thoughts.css">
</head>
<body>
  <div class="container">
    <header></header>

    <main>
      <h1 class="page-title fade-in">Thoughts</h1>

      <!-- Auth buttons -->
      <div class="auth-buttons fade-in fade-in-delay-1">
        <button id="github-login-btn" class="github-login-btn">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          Login with GitHub
        </button>
        <button id="logout-btn" class="logout-btn hidden">Logout</button>
      </div>

      <!-- Compose box (hidden until authenticated) -->
      <div id="compose-box" class="compose-box hidden fade-in fade-in-delay-2">
        <div class="compose-header">
          <div id="compose-avatar" class="compose-avatar">BJ</div>
          <div class="compose-input">
            <textarea id="compose-text" placeholder="What's on your mind?"></textarea>
            <div id="image-preview-container" class="image-preview-container"></div>
          </div>
        </div>
        <div class="compose-actions">
          <div class="compose-options">
            <label class="compose-option" title="Add image">
              <input type="file" id="image-input" accept="image/*" multiple hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <polyline points="21 15 16 10 5 21"/>
              </svg>
            </label>
          </div>
          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <span class="compose-hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> to post</span>
            <button id="compose-submit" class="compose-submit" disabled>Post</button>
          </div>
        </div>
      </div>

      <!-- Feed -->
      <div id="thoughts-feed" class="thoughts-feed fade-in fade-in-delay-2">
        <div class="loading-spinner">
          <div class="spinner"></div>
        </div>
      </div>
    </main>

    <footer></footer>
  </div>

  <!-- Image Lightbox -->
  <div id="image-lightbox" class="image-lightbox">
    <button class="image-lightbox-close">&times;</button>
    <img id="lightbox-img" src="" alt="Full size image">
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Modal Overlay -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <h3 id="modal-title" class="modal-title"></h3>
      <p id="modal-message" class="modal-message"></p>
      <div id="modal-content"></div>
      <div class="modal-actions">
        <button id="modal-cancel" class="modal-btn cancel">Cancel</button>
        <button id="modal-confirm" class="modal-btn confirm">Confirm</button>
      </div>
    </div>
  </div>

  <script src="../js/components.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/interactions-common.js"></script>
  <script src="../js/thoughts.js"></script>
</body>
</html>
