<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blogs - Basu Jindal</title>
  <meta name="description" content="Blog posts on AI, ML, and more by Basu Jindal">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <header></header>

    <main>
      <h1 class="page-title">Blogs</h1>
      <p class="page-subtitle">Notes on AI, ML, and more</p>

      <div class="blog-grid" id="blog-grid">
      </div>
    </main>

    <footer></footer>
  </div>
  <script src="../js/components.js"></script>
  <script src="../js/main.js"></script>
  <script>
    const blogs = [
      { slug: 'diffusion', description: 'Understanding diffusion models for generative AI.' },
      { slug: 'Generative-Models', description: 'Overview of generative AI models.' },
      { slug: 'paraest', description: 'Notes on parameter estimation techniques.' },
      { slug: 'probstat', description: 'Foundations of probability and statistics.' },
      { slug: 'LLM', description: 'Notes on LLMs - tokenization, decoding strategies, parameter counting, and more.' }
    ];

    async function loadBlogs() {
      const grid = document.getElementById('blog-grid');
      const blogData = await Promise.all(blogs.map(async (blog) => {
        const res = await fetch(`../blogs/md/${blog.slug}.md`);
        const text = await res.text();
        const frontMatter = text.match(/^---\n([\s\S]*?)\n---/);
        let title = blog.slug;
        let date = '';
        if (frontMatter) {
          const titleMatch = frontMatter[1].match(/title:\s*["']?(.+?)["']?\s*$/m);
          const dateMatch = frontMatter[1].match(/date:\s*(\d{4}-\d{2}-\d{2})/);
          if (titleMatch) title = titleMatch[1];
          if (dateMatch) date = dateMatch[1];
        }
        return { ...blog, title, date };
      }));

      blogData.sort((a, b) => new Date(b.date) - new Date(a.date));

      blogData.forEach(blog => {
        const dateObj = new Date(blog.date + 'T00:00:00');
        const formatted = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        grid.innerHTML += `
          <a href="post.html?section=blogs&p=${blog.slug}" class="blog-card">
            <div class="blog-card-content">
              <time datetime="${blog.date}">${formatted}</time>
              <h2>${blog.title}</h2>
              <p>${blog.description}</p>
            </div>
            <span class="blog-card-arrow">&rarr;</span>
          </a>
        `;
      });
    }
    loadBlogs();
  </script>
</body>
</html>
