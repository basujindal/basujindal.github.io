<!DOCTYPE html>
<html>
<head>
    <title>Map of Visitors</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-top: 20px;
        }
        .header h1 {
            color: #333;
            margin: 0;
            font-size: 2.5em;
        }
        .visitor-count {
            color: #555;
            margin-top: 10px;
            font-size: 1.2em;
        }
        #map { 
            height: 600px; 
            width: 90%; 
            max-width: 1200px; 
            margin: 20px 0;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Map of Visitors</h1>
        <div class="visitor-count">Unique Visitors = <span id="uniqueVisitors"></span></div>
    </div>
    <div id="map"></div>

    <script>
        var map = L.map('map').setView([0, 0], 2); // Center the map

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 18
        }).addTo(map);


        fetch('https://server.basujindal.me/map_logs')
            .then(response => response.json())
            .then(data => {
                var logs = JSON.parse(data.logs);
                var uv = data.unique_visitors;

            for(i = 0; i < logs.length; i++){
                var log = logs[i];
                if (log.latitude && log.longitude) {
                    var marker = L.marker([log.latitude, log.longitude]).addTo(map);
                    if (log.message) {
                        marker.bindPopup(log.message).openPopup();
                    }
                }
            };

            // Update unique visitors count
            document.getElementById('uniqueVisitors').textContent = uv;

        });
    </script>

    <script>

    function getQueryParam(param) {
        var queryString = window.location.search;
        var urlParams = new URLSearchParams(queryString);
        return urlParams.get(param);
    }
    
    
    async function postData(url = serverUrl, options) {
          const response = await fetch(url, options);
          return response.json();
      }    
    
    
    // Function to send location data to a server
    function sendData(latitude, longitude) {
    
        const serverUrl = 'https://server.basujindal.me/log_location/'
        var val = getQueryParam('val');
        var url = window.location.href;
        
        const fpPromise = import('https://basujindal.me/fp.js')
        .then(FingerprintJS => FingerprintJS.load())
        fpPromise
        .then(fp => fp.get())
        .then(fingerprint => {
        
        const data = { latitude, longitude, val, url, fingerprint};
        const options = {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data),
        };
    
        postData(serverUrl, options)
            .then(data => {
                console.log(data);
            });
    
        })
      
    }
    
    sendData(0, 0);

</script>

</body>
</html>
